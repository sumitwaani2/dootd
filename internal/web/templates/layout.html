{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · dootd</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">dootd</a>
  {{if .CSRF}}
  <nav>
    <a href="/" {{if eq .Nav "apps"}}class="on"{{end}}>Apps</a>
    <a href="/settings" {{if eq .Nav "settings"}}class="on"{{end}}>Settings</a>
    <a href="/account" {{if eq .Nav "account"}}class="on"{{end}}>Account</a>
    <form method="post" action="/logout" class="inline"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="link">Sign out</button></form>
  </nav>
  {{end}}
</header>
<main>
{{if .Flash}}<div class="flash {{if .FlashOK}}ok{{else}}err{{end}}" role="status">{{.Flash}}</div>{{end}}
{{template "content" .}}
</main>
<footer>dootd {{.Version}}</footer>
</body>
</html>{{end}}

{{define "csrf"}}<input type="hidden" name="csrf" value="{{.}}">{{end}}

{{define "state"}}<span class="badge s-{{.}}">{{.}}</span>{{end}}
