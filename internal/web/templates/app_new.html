{{define "content"}}
<section class="card">
  <h1>Add app</h1>
  {{with .Data.Errors}}<div class="error"><b>Please fix:</b><ul>{{range .}}<li>{{.}}</li>{{end}}</ul></div>{{end}}
  {{with .Data.In}}
  <form method="post" action="/apps" class="grid">
    {{template "csrf" $.CSRF}}
    <label class="wide">GitHub repository <input name="repo" value="{{.Repo}}" required placeholder="https://github.com/you/blog" list="repos">
      <small>The app is named after the repository (e.g. <code>my_blog</code> → <code>my-blog</code>). <code>dootd.toml</code> must be at its root.</small></label>
    {{with $.Data.Repos}}<datalist id="repos">{{range .}}<option value="https://github.com/{{.FullName}}">{{end}}</datalist>{{end}}
    <label>Branch <input name="branch" value="{{.Branch}}" required></label>
    <label>Type
      <select name="type">
        <option value="zig" {{if eq .Type "zig"}}selected{{end}}>Zig</option>
        <option value="c" {{if eq .Type "c"}}selected{{end}}>C (built with zig cc)</option>
      </select>
      <small>Only changes the default build command</small>
    </label>
    <label class="wide">Domain <input name="domain" value="{{.Domain}}" placeholder="blog.example.com"><small>DNS record and certificate are created in Cloudflare</small></label>
    {{if $.Data.BucketSet}}
    <label class="wide">Start with data from
      <select name="restore_from">
        <option value="@auto" {{if eq .RestoreFrom "@auto"}}selected{{end}}>the backup folder with the app's name, if there is one</option>
        <option value="" {{if eq .RestoreFrom ""}}selected{{end}}>nothing (empty database)</option>
        {{range $.Data.Folders}}<option value="{{.}}" {{if eq $.Data.In.RestoreFrom .}}selected{{end}}>backup folder {{.}}/ (newest backup)</option>{{end}}
      </select>
      <small>The newest backup of the chosen bucket folder is verified and put into the new app's DATA_DIR before the first deploy.{{with $.Data.FoldersErr}} <span class="error-text">Could not list the bucket: {{.}}</span>{{end}}</small>
    </label>
    {{end}}
    <fieldset class="wide">
      <legend>Limits</legend>
      <label>Memory <input name="memory" value="{{.Memory}}" size="6"></label>
      <label>CPU cores <input name="cpu" value="{{.CPU}}" size="4"></label>
      <label>Processes <input name="pids" value="{{.Pids}}" size="5"></label>
      <label>Build memory <input name="build_memory" value="{{.BuildMemory}}" size="6"></label>
      <label>Build timeout <input name="build_timeout" value="{{.BuildTimeout}}" size="6"></label>
    </fieldset>
    <div class="wide"><button class="primary">Create app</button> <a href="/">Cancel</a></div>
  </form>
  {{end}}
</section>
{{end}}
