name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Lint and test
        run: make lint test
      - name: Build release binaries
        run: make build-all VERSION=${GITHUB_REF_NAME}
      - name: Smoke test
        run: ./dist/dootd-linux-amd64 version | grep -F "dootd ${GITHUB_REF_NAME} "
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          # Tags like v1.2.0-rc1 are prereleases; they are not served as "latest".
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${prerelease} \
            dist/dootd-linux-amd64 \
            dist/dootd-linux-arm64 \
            dist/checksums.txt \
            install.sh
