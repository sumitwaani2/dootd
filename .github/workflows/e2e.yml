name: E2E

# Runs the phase end-to-end scripts on a real Ubuntu 24.04 VM (systemd,
# cgroup v2 with all controllers), which unit tests cannot cover.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Phase 1 - run supervised apps
        run: sudo env "PATH=$PATH" GOTOOLCHAIN=local ./scripts/e2e/phase1.sh


  phase2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Phase 2 - build and deploy
        run: sudo env "PATH=$PATH" GOTOOLCHAIN=local ./scripts/e2e/phase2.sh

  phase3:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Phase 3 - edge (TLS, Cloudflare-only, AOP, routing)
        run: sudo env "PATH=$PATH" GOTOOLCHAIN=local ./scripts/e2e/phase3.sh

  phase4:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Phase 4 - first run and dashboard
        run: sudo env "PATH=$PATH" GOTOOLCHAIN=local ./scripts/e2e/phase4.sh

  phase5:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Phase 5 - backups (rclone serve s3 as the bucket)
        run: sudo env "PATH=$PATH" GOTOOLCHAIN=local ./scripts/e2e/phase5.sh

  phase6:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Phase 6 - monitoring
        run: sudo env "PATH=$PATH" GOTOOLCHAIN=local ./scripts/e2e/phase6.sh

  phase7:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Phase 7 - install, update, recovery, new server
        run: sudo env "PATH=$PATH" GOTOOLCHAIN=local ./scripts/e2e/phase7.sh
